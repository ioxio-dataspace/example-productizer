[tool.poetry]
name = "ioxio-dataspace-example-productizer"
version = "1.0.0"
description = ""
authors = ["IOXIO Oy"]
packages = [{ include = "app", from = "." }]

[tool.poetry.dependencies]
python = "^3.11"
fastapi = "^0.115.12"
uvicorn = {version = "^0.34.0", extras = ["standard"]}
invoke = "^2.2.0"
pydantic = "^2.11.3"
yarl = "^1.19.0"
pyjwt = "^2.10.1"
httpx = "^0.28.1"
cryptography = "^44.0.2"
async-lru = "^2.0.5"

[tool.skjold]
report_only = false
sources = ["pyup", "gemnasium"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
